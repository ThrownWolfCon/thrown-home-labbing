# Checks prose (Vale) and Markdown structure (markdownlint) on pull requests,
# and confirms the site still builds.
name: Lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  HUGO_VERSION: 0.170.1
  VALE_VERSION: 3.28.1

jobs:
  vale:
    name: Prose (Vale)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Vale
        run: |
          curl -sSL https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz \
            | sudo tar xz -C /usr/local/bin vale
          vale --version

      - name: Fetch the Grafana style and sync packages
        run: make vale-sync

      - name: Run Vale
        run: vale content/

  markdownlint:
    name: Markdown (markdownlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: "content/**/*.md"

  build:
    name: Hugo build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          cache: false
      - name: Install Hugo
        run: |
          curl -sSL -o ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Build (fails on broken internal links)
        run: hugo --gc --panicOnWarning
