# markdownlint rules: https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md
config:
  default: true
  MD013: false          # line length: prose is written one paragraph per line
  MD024:
    siblings_only: true # allow repeated headings in different sections
  MD025:
    front_matter_title: ""  # pages have a title in front matter, not an H1
  MD033: false          # allow inline HTML such as <kbd> and <br>
  MD041: false          # first line is front matter, not a heading
  MD046:
    style: fenced
  MD029:
    style: one_or_ordered

ignores:
  - "public/**"
  - "node_modules/**"
