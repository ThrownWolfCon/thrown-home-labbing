# Prose linting with Vale, using Grafana Labs' Writers' Toolkit style.
# The Grafana style is fetched by `make vale-sync` (see Makefile); it is not committed.
StylesPath = .vale/styles
MinAlertLevel = warning
Packages = https://github.com/errata-ai/Hugo/releases/download/v0.2.0/Hugo.zip
Vocab = Thrown

[*.md]
BasedOnStyles = Grafana
# Ignore bare URLs, bold UI text, and Hugo shortcodes.
TokenIgnores = (<http[^\n]+>+?), \*\*[^\n]+\*\*, ({{<[\s\S]+?>}}|{{%[\s\S]+?%}})
